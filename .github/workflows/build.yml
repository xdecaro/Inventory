name: Build Inventory
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate PHP and Core boundary
        run: |
          find component package tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/core-integration-smoke.php
      - name: Validate XML
        run: |
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          for p in pathlib.Path('.').rglob('*.xml'): ET.parse(p)
          PY
      - name: Guard database boundary
        run: |
          ! grep -RniE 'DROP[[:space:]]+TABLE|TRUNCATE[[:space:]]+TABLE' component/admin/sql
          ! grep -RniE '#__(dcl|decaroforms|decarocourses|decarodocuments|decaromembership|decaroevents|decarofinance|decaroprotocol|decarodraw|decaroorganizations|decaropeople)_' component --exclude-dir=.git
      - name: Verify technical identity
        run: |
          test "$(cat VERSION)" = '0.2.0'
          test -f component/xdecaroinventory.xml
          test -f package/pkg_xdecaroinventory.xml
          grep -Fq 'xdecaro\Component\Inventory' component/xdecaroinventory.xml
          grep -Fq '#__xdecaroinventory_' component/admin/sql/install.mysql.utf8mb4.sql
          ! grep -RInE 'com_decaroinventory|pkg_decaroinventory|#__decaroinventory_|Decaroinventory' component package build tests updates README.md
          ! grep -RIn 'Xdecaro\\' component package build tests updates README.md
      - name: Deterministic build
        run: |
          chmod +x build/build.sh
          build/build.sh
          cp dist/SHA256SUMS.txt /tmp/sums
          build/build.sh
          diff -u /tmp/sums dist/SHA256SUMS.txt
          for z in dist/*.zip; do unzip -t "$z" >/dev/null; done
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.3'
        with:
          name: xdecaroinventory-${{ github.sha }}
          path: dist/
