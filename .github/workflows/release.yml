name: Release Inventory package

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Read version
        run: echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
      - name: Refuse existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then echo "Release already exists"; exit 1; fi
      - name: Validate and build twice
        run: |
          find component package tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/core-integration-smoke.php
          test -f component/xdecaroinventory.xml
          test -f package/pkg_xdecaroinventory.xml
          grep -Fq 'xdecaro\Component\Inventory' component/xdecaroinventory.xml
          grep -Fq '#__xdecaroinventory_' component/admin/sql/install.mysql.utf8mb4.sql
          ! grep -RIn 'Xdecaro\\' component package build tests updates README.md
          chmod +x build/build.sh
          build/build.sh
          cp dist/SHA256SUMS.txt /tmp/sums
          build/build.sh
          diff -u /tmp/sums dist/SHA256SUMS.txt
          for z in dist/*.zip; do unzip -t "$z" >/dev/null; done
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" dist/com_xdecaroinventory_${VERSION}.zip dist/pkg_xdecaroinventory_${VERSION}.zip dist/SHA256SUMS.txt --prerelease --title "Inventory by xdecaro ${VERSION}" --notes "Fresh prerelease technical baseline using com_xdecaroinventory, pkg_xdecaroinventory, xdecaro\\Component\\Inventory and #__xdecaroinventory_*; inventory domain ownership remains local."
      - name: Publish package checksum
        run: |
          export PACKAGE_SHA="$(sha256sum "dist/pkg_xdecaroinventory_${VERSION}.zip" | awk '{print $1}')"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          p=Path('updates/pkg_xdecaroinventory.xml')
          t=p.read_text()
          t=re.sub(r'<sha256>[^<]*</sha256>','',t)
          t=t.replace('</downloads>',f'</downloads><sha256>{os.environ["PACKAGE_SHA"]}</sha256>',1)
          p.write_text(t)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/pkg_xdecaroinventory.xml
          git diff --cached --quiet || git commit -m "Publish SHA-256 for Inventory ${VERSION}"
          git push
